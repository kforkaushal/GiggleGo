name: gigglego
description: "Giggle Go! — A colorful preschool learning app for ages 2–6."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/mascot/
    - assets/images/ui/
    - assets/images/alphabet/
    - assets/images/objects/
    - assets/images/shapes/
    - assets/images/colors/
    - assets/images/vehicles/
    - assets/images/animals/
    - assets/images/fruits/
    - assets/images/mascot_seq/
    - assets/images/alphabet_seq/
    - assets/images/appear/
    - assets/images/categories/
    - assets/images/items/animals/
    - assets/images/items/colors/
    - assets/images/items/fruits/
    - assets/images/items/vehicles/
    - assets/sounds/

  fonts:
    - family: AnjaEliane
      fonts:
        - asset: assets/fonts/AnjaEliane.ttf
    - family: AlteHaasGrotesk
      fonts:
        - asset: assets/fonts/AlteHaasGroteskRegular.ttf
        - asset: assets/fonts/AlteHaasGroteskBold.ttf
          weight: 700
